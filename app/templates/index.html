<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <title>Smart Data Processor</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Smart Data Processor</a>
      </div>
    </nav>

    <div class="card text-center mx-auto mt-5" style="max-width: 500px">
      <div class="card-header">Smart Data Processor</div>
      <div class="card-body">
        <h5 class="card-title">Upload an Image</h5>
        <p class="card-text">The image will be cropped and resized to 300×300.</p>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form action="/" method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <input class="form-control" type="file" id="image" name="image" required />
          </div>
          <button type="submit" class="btn btn-dark w-100">Upload</button>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
