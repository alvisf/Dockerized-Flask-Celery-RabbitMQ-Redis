<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <title>Processing — Smart Data Processor</title>
    <style>
      #prog { width: 100%; height: 20px; background: #e9ecef; border-radius: 4px; }
      #bar  { width: 0; height: 100%; background: #0d6efd; border-radius: 4px; transition: width .3s; }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <h3>Image Cropping</h3>
      <div id="imgpl" class="my-3">Image not ready. Please wait…</div>
      <div id="wrapper"><div id="prog"><div id="bar"></div></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" crossorigin="anonymous"></script>
    <script>
      function poll() {
        $.getJSON("{{ url_for('.progress', jobid=JOBID) }}", function (resp) {
          $("#bar").css({ width: (resp.progress * 100) + "%" });
          if (resp.progress >= 0.99) {
            $("#wrapper").html("");
            $.get("result.png?jobid={{ JOBID }}", function (data) {
              $("#imgpl").html('<img src="' + data + '" class="img-fluid" alt="Cropped image">');
            });
          } else {
            setTimeout(poll, 500);
          }
        });
      }
      $(poll);
    </script>
  </body>
</html>
